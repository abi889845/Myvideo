
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UC Link</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{height:65px;background:#1c1c1c;display:flex;align-items:center;padding:0 6%;border-bottom:1px solid #333}
.logo{font-size:20px;font-weight:bold;color:#ff851b}
main{max-width:950px;margin:35px auto;padding:0 18px}
video{width:100%;aspect-ratio:16/9;display:block;background:#000;border-radius:12px}
h2{font-size:21px;margin:22px 0 8px}
.desc{color:#aaa;font-size:14px;line-height:1.6}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
button{background:#ff851b;color:white;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
button:hover{background:#e66d00}
.secondary{background:#292929}
.settings{display:flex;align-items:center;gap:10px;margin-top:20px;color:#aaa;font-size:14px}
select{background:#292929;color:white;padding:8px;border:1px solid #444;border-radius:6px}
footer{text-align:center;color:#666;font-size:12px;padding:35px}
</style>
</head>
<body>

<header>
  <div class="logo">▶ UC Browser</div>
</header>

<main>
  <video id="video" controls playsinline preload="metadata">
    <source src="video.mp4" type="video/mp4">
    Browser kamu tidak mendukung pemutar video.
  </video>

  <h2 id="title">Judul Video</h2>
  <div class="desc" id="description">
    Deskripsi video ditampilkan di sini.
  </div>

  <div class="actions">
    <button onclick="downloadVideo()">↓ Download</button>
    <button class="secondary" onclick="copyLink()">↗ Salin Link</button>
    <button class="secondary" onclick="shareVideo()">Bagikan</button>
  </div>

  <div class="settings">
    <span>Kecepatan:</span>
    <select id="speed">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2x</option>
    </select>
  </div>
</main>

<footer>Personal Video Player © 2026</footer>

<script>
const video = document.getElementById("video");
const VIDEO_URL = "video.mp4";

document.getElementById("speed").onchange = function(){
  video.playbackRate = Number(this.value);
};

function downloadVideo(){
  const a = document.createElement("a");
  a.href = VIDEO_URL;
  a.download = "video.mp4";
  a.click();
}

async function copyLink(){
  try {
    await navigator.clipboard.writeText(location.href);
    alert("Link berhasil disalin!");
  } catch {
    alert("Gagal menyalin link.");
  }
}

async function shareVideo(){
  if(navigator.share){
    await navigator.share({
      title: document.title,
      url: location.href
    });
  }else{
    copyLink();
  }
}
</script>
</body>
</html>
